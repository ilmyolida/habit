name: habit
description: HabitGenius - 5 in 1 Habit, Mood, Expense, Journal, Focus Tracker
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^9.1.1
  
  # Database
  sqflite: ^2.3.3
  path_provider: ^2.1.2
  
  # Notifications
  flutter_local_notifications: ^21.0.0
  
  # Charts
  fl_chart: ^1.2.0
  
  # Google Drive Backup
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.0
  
  # File operations
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  
  # UI
  reorderables: ^0.6.0
  drag_and_drop_lists: ^0.4.2
  
  # Haptic & Sound
  vibration: ^3.1.8
  just_audio: ^0.10.5
  
  # Localization
  easy_localization: ^3.0.2
  
  # In App Purchase
  in_app_purchase: ^3.1.7
  
  # Utils
  intl: 0.20.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_main"
  ios: true
  image_path: "assets/images/icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.jpg"
  
  macos:
    generate: true
    image_path: "assets/images/icon.jpg"
    
  windows:
    generate: true
    image_path: "assets/images/icon.jpg"
    icon_size: 256

  linux:
    generate: true
    image_path: "assets/images/icon.jpg"

# The following section is specific to Flutter packages.

flutter:
  generate: false
  uses-material-design: true

  assets:
    - assets/audio/notifications.aas/
    - assets/backgrounds/
    - assets/data/
    - assets/fonts/
    - assets/icons/
    - assets/images/backgrounds/
    - assets/images/icons/
    - assets/images/icon.jpg
    - assets/images/splash.jpg
    - assets/translations/
    - assets/icon_foreground.jpg
    - assets/icon.jpg
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic