name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v3 dan v4 ga o'tdi
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - name: Upload APK
        uses: actions/upload-artifact@v4 # v3 dan v4 ga o'tdi (Xatolik shu yerda edi)
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
